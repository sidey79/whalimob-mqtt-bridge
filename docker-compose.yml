name: whalibmob-mqtt-bridge

services:
  whalibmob-bridge:
    build:
      context: .
    image: ghcr.io/sidey79/whalibmob-mqtt-bridge:${VERSION:-0.1.0}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: ${HEALTH_PORT:-3000}
      MQTT_HOST: ${MQTT_HOST:-fhem}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_URL: ${MQTT_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-whalibmob}
      WA_PHONE: ${WA_PHONE:-}
      WA_SESSION_DIR: /data/session
      MEDIA_ALLOWED_HOSTS: ${MEDIA_ALLOWED_HOSTS:-fhem,192.168.1.10}
      MEDIA_MAX_SIZE_MB: ${MEDIA_MAX_SIZE_MB:-10}
    volumes:
      - whalibmob-session:/data/session
    networks:
      - whalibmob-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.HEALTH_PORT||3000)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  whalibmob-internal:
    name: whalibmob-mqtt-internal
    internal: true

volumes:
  whalibmob-session:
